name: Supabase Keep Alive

on:
  schedule:
     - cron: '0 0 * * 0' # A cada 7 dias (todo domingo às 00:00 UTC)
  workflow_dispatch: # Permite executar manualmente
  
jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase keep-alive function
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            "${{ secrets.SUPABASE_URL }}/functions/v1/keep-alive" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json")
          echo "Response status: $response"
          if [ "$response" != "200" ]; then
            echo "Keep-alive failed with status $response"
            exit 1
          fi
          echo "Keep-alive successful"
